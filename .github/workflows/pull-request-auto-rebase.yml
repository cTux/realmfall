name: Pull Request Auto-Rebase

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  rebase-default-branch-into-pull-request:
    if: |
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check out the pull request branch
        run: |
          git fetch origin "${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          git switch "${{ github.event.pull_request.head.ref }}"

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.8

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase the pull request branch and resolve package version conflicts
        id: rebase-pr
        run: node scripts/rebase-master-and-push.mjs

      - name: Run full validation after the rebase
        if: steps.rebase-pr.outputs.run_checks == 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
