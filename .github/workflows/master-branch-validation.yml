name: Master Branch Validation

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate-typecheck-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository content
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.8

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace type checks
        run: pnpm typecheck

      - name: Run workspace lint checks
        run: pnpm lint

  validate-node-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository content
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.8

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Vitest cache directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tests/vitest-cache
          key: >-
            vitest-cache-${{ runner.os }}-${{ hashFiles(
              'pnpm-lock.yaml',
              'package.json',
              'packages/client/vite.config.ts',
              'packages/client/tsconfig.json',
              'packages/client/tsconfig.node.json',
              'packages/client/src/test/setup.node.ts',
              'packages/client/src/test/setup.shared.ts',
              'packages/client/src/test/setup.ts'
            ) }}
          restore-keys: |
            vitest-cache-${{ runner.os }}-

      - name: Run workspace automated tests
        run: pnpm test

  validate-production-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository content
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.0.8

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the production build
        run: pnpm build
